name: Publish to Wasmer

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies & Build Next.js
        run: |
          npm install
          npm run build

      - name: Setup Wasmer CLI
        uses: wasmerio/setup-wasmer@v3

      - name: Login to Wasmer
        run: wasmer login --token ${{ secrets.WASMER_TOKEN }}

      - name: Publish to Wasmer
        run: wasmer publish --non-interactive
